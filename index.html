<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Мониторинг расписания школ (2026-2027)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --bg: #f5f6fa;
            --border: #dcdde1;
            --zilart: #9b59b6;
            --parusa: #e74c3c;
            --freedom: #e67e22;
            --tyumen: #2ecc71;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: var(--primary); }
        .stats { text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 14px;}
        
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #dfe6e9; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--secondary); color: white; }
        .print-btn { padding: 10px 20px; cursor: pointer; border: none; background: var(--primary); color: white; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .print-btn:hover { background: #1a252f; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .filters { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; padding: 15px; background: #f1f2f6; border-radius: 8px; }
        .filter-group { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #7f8c8d; }
        select, input[type="date"] { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--primary); color: white; position: sticky; top: 0; }
        tr:hover { background: #f1f2f6; }
        .alert { padding: 15px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
        .alert-danger { background: #ffcccc; color: #c0392b; }
        .alert-success { background: #d4edda; color: #27ae60; }
        
        .school-badge { padding: 3px 8px; border-radius: 12px; color: white; font-size: 12px; font-weight: bold; }
        .badge-zilart { background: var(--zilart); }
        .badge-parusa { background: var(--parusa); }
        .badge-freedom { background: var(--freedom); }
        .badge-tyumen { background: var(--tyumen); }
        
        .table-wrapper { max-height: 600px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }

        /* Стили для календаря */
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .month-card { border: 1px solid var(--border); border-radius: 8px; padding: 15px; background: #fff; }
        .month-card h3 { margin-top: 0; text-align: center; color: var(--secondary); margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 12px; color: #7f8c8d; margin-bottom: 5px; }
        .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-day { text-align: center; padding: 5px 0; font-size: 13px; border-radius: 4px; }
        .cal-day.empty { color: transparent; }
        .cal-day.weekend { color: #e74c3c; background: #fdf2f2; }
        .cal-day.holiday { color: white; background: #e74c3c; font-weight: bold; }
        .cal-day.today { border: 2px solid var(--secondary); font-weight: bold; }

        /* Стили для печати */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .tabs, .filters, .alert, #stats, .print-btn { display: none !important; }
            .tab-content { display: none; }
            .tab-content.active { display: block !important; }
            .table-wrapper { max-height: none; overflow: visible; border: none; }
            table { width: 100%; border-collapse: collapse; }
            th { background: #f1f1f1 !important; color: black !important; border-bottom: 2px solid black; }
            td, th { border: 1px solid #ccc; }
            .calendar-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .month-card { break-inside: avoid; border: 1px solid #000; }
            .cal-day.holiday { background: #ccc !important; color: black !important; border: 1px solid black; }
        }
    </style>
</head>

            </div>

        </div>
        <div id="date-alert"></div>
        <div class="table-wrapper">
            <table id="date-results">

                <tbody></tbody>

    <!-- ВКЛАДКА 2: ПОИСК ПО ПРЕДМЕТУ -->
    <div id="tab-subject" class="tab-content">

            </div>

        <div class="table-wrapper">

</div>

    function openTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
        
        if(tabId === 'tab-subject') populateSubjects();

    function updateClasses(schoolSelectId, classSelectId) {
        const school = document.getElementById(schoolSelectId).value;
        const classSelect = document.getElementById(classSelectId);
        classSelect.innerHTML = '';
        
        const classes = [...new Set(scheduleData.filter(item => item.school === school).map(item => item.class))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
        
        if (classes.length === 0) {
            classSelect.innerHTML = '<option value="">Нет данных</option>';
        } else {
            classes.forEach(c => {
                const option = document.createElement('option');
                option.value = c;
                option.textContent = c + ' класс';
                classSelect.appendChild(option);
            });
        }
        
        if(schoolSelectId === 'date-school') searchByDate();
        if(schoolSelectId === 'subj-school') populateSubjects();
    }

    function searchByDate() {
        const school = document.getElementById('date-school').value;
        const className = document.getElementById('date-class').value;
        const dateStr = document.getElementById('search-date').value;
        const tbody = document.querySelector('#date-results tbody');
        const alertBox = document.getElementById('date-alert');
        tbody.innerHTML = '';
        alertBox.innerHTML = '';

        if (!dateStr || !className) return;

        const dateObj = new Date(dateStr + 'T00:00:00');
        const dayOfWeek = daysOfWeek[dateObj.getDay()];

        if (holidays.includes(dateStr) || dayOfWeek === 'Суббота' || dayOfWeek === 'Воскресенье') {
            alertBox.innerHTML = `<div class="alert alert-danger">Внимание! ${dateStr} (${dayOfWeek}) — выходной, праздничный день или каникулы. Уроков нет.</div>`;
            return;
        }

        alertBox.innerHTML = `<div class="alert alert-success">Расписание на ${dateStr} (${dayOfWeek}) для ${className} класса школы "${school}":</div>`;

        const lessons = scheduleData.filter(item => 
            item.school === school && 
            item.class === className && 
            item.day === dayOfWeek
        );

        if (lessons.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Нет уроков по расписанию</td></tr>';
            return;
        }

        lessons.sort((a, b) => a.time.split('–')[0].localeCompare(b.time.split('–')[0]));

        lessons.forEach((lesson, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${lesson.time}</strong></td>
                <td>${lesson.subject}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function populateSubjects() {
        const school = document.getElementById('subj-school').value;
        const className = document.getElementById('subj-class').value;
        const subjectSelect = document.getElementById('subj-subject');
        
        const currentVal = subjectSelect.value;
        subjectSelect.innerHTML = '<option value="">-- Выберите предмет --</option>';
        
        if (!className) return;
        
        const subjects = [...new Set(scheduleData.filter(item => item.school === school && item.class === className).map(item => item.subject))].sort();
        
        subjects.forEach(s => {
            const option = document.createElement('option');
            option.value = s;
            option.textContent = s;
            subjectSelect.appendChild(option);
        });
        
        if (subjects.includes(currentVal)) subjectSelect.value = currentVal;
        searchBySubject();
    }

    function searchBySubject() {
        const school = document.getElementById('subj-school').value;
        const subject = document.getElementById('subj-subject').value;
        const tbody = document.querySelector('#subject-results tbody');
        tbody.innerHTML = '';

        if (!subject) return;

        const lessons = scheduleData.filter(item => item.school === school && item.subject === subject);

        if (lessons.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Совпадений не найдено</td></tr>';
            return;
        }

        const dayOrder = { "Понедельник": 1, "Вторник": 2, "Среда": 3, "Четверг": 4, "Пятница": 5, "Суббота": 6 };
        lessons.sort((a, b) => {
            if (dayOrder[a.day] !== dayOrder[b.day]) return dayOrder[a.day] - dayOrder[b.day];
            return a.time.split('–')[0].localeCompare(b.time.split('–')[0]);
        });

        lessons.forEach(lesson => {
            const tr = document.createElement('tr');
            let badgeClass = 'badge-zilart';
            if(lesson.school === 'Алые паруса') badgeClass = 'badge-parusa';
            if(lesson.school === 'Фридом') badgeClass = 'badge-freedom';
            if(lesson.school === 'Тюмень') badgeClass = 'badge-tyumen';

            tr.innerHTML = `
                <td>${lesson.day}</td>
                <td><strong>${lesson.time}</strong></td>
                <td>${lesson.class} класс</td>
                <td><span class="school-badge ${badgeClass}">${lesson.school}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-container');
        if (container.innerHTML !== '') return; // Избегаем повторной отрисовки

        const startYear = 2026;
        const endYear = 2027;
        
        // Месяцы, которые нужно отобразить (сентябрь 2026 - июнь 2027)
        const monthsToRender = [
            { year: 2026, month: 8 },  // Сентябрь (индекс 8)
            { year: 2026, month: 9 },  // Октябрь
            { year: 2026, month: 10 }, // Ноябрь

            { year: 2027, month: 3 },  // Апрель
            { year: 2027, month: 4 },  // Май
            { year: 2027, month: 5 }   // Июнь
        ];

        let html = '';
        const todayStr = new Date().toISOString().split('T')[0];

        monthsToRender.forEach(m => {
            const firstDay = new Date(m.year, m.month, 1);
            const lastDay = new Date(m.year, m.month + 1, 0);
            const daysInMonth = lastDay.getDate();
            
            // День недели первого дня (0 - Вс, 1 - Пн, ...)
            let startDayOfWeek = firstDay.getDay();
            if (startDayOfWeek === 0) startDayOfWeek = 7; // Делаем Пн=1, Вс=7 для сетки
            
            html += `<div class="month-card">`;
            html += `<h3>${monthNames[m.month]} ${m.year}</h3>`;
            html += `<div class="cal-weekdays">
                        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
                     </div>`;
            html += `<div class="cal-days">`;

            // Пустые ячейки до начала месяца
            for (let i = 1; i < startDayOfWeek; i++) {
                html += `<div class="cal-day empty"></div>`;
            }

            // Дни месяца
            for (let d = 1; d <= daysInMonth; d++) {
                // Форматируем дату как YYYY-MM-DD
                const monthStr = String(m.month + 1).padStart(2, '0');
                const dayStr = String(d).padStart(2, '0');
                const dateString = `${m.year}-${monthStr}-${dayStr}`;
                
                const dateObj = new Date(m.year, m.month, d);
                const dayOfWeek = dateObj.getDay(); // 0 - Вс, 6 - Сб
                
                let classNames = "cal-day";
                
                // Проверяем выходные
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    classNames += " weekend";
                }
                
                // Проверяем каникулы и праздники
                if (holidays.includes(dateString)) {
                    classNames += " holiday";
                }
                
                // Подсветка сегодняшнего дня
                if (dateString === todayStr) {
                    classNames += " today";
                }

                html += `<div class="${classNames}">${d}</div>`;
            }
            html += `</div></div>`;
        });

        container.innerHTML = html;
    }

    window.onload = () => {
        document.getElementById('stats').innerText = `В базе данных: ${scheduleData.length} записей (уроки и кружки).`;
        updateClasses('date-school', 'date-class');
        updateClasses('subj-school', 'subj-class');
        
        // Автоматически устанавливаем текущую дату, если она в учебном году
        const today = new Date().toISOString().split('T')[0];
        if (today >= '2026-09-01' && today <= '2027-06-12') {
            document.getElementById('search-date').value = today;
            searchByDate();
        }
    };
</script>

</body>
</html>
